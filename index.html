<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Accesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fdfdfd;color:#111;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<form id="f" autocomplete="off" style="min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:360px;margin:0 auto;padding:24px 20px">
  <span style="font-family:'Inter Tight',sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.02em;display:inline-flex;align-items:center;gap:0.5em"><span style="width:8px;height:8px;border-radius:50%;background:#2b4ee6;display:inline-block"></span>Accesso</span>
  <input id="p" type="password" placeholder="Password" aria-label="Password" autofocus style="height:48px;width:100%;border:1.5px solid #d2d2d2;border-radius:999px;padding:0 18px;font:inherit;font-size:16px;outline:none;color:#111;background:#fff">
  <span id="e" role="alert" style="min-height:18px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#8a8a8a"></span>
</form>
<script>
(function(){
  var D = { s: 'TYqY8aPFt2TkfZkkWJ8ZzA==', i: '2IjuJYat2oQwQVym', c: 'UZLspCkV96u87H4ZNUO17CQ0RtoidEuQoAqvQYF5ZGmwN5ehC7I79k0elOOb6EfM1zj07SitYMgjwQ1zmNWZlUy9ad41' };
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var f = document.getElementById('f'), p = document.getElementById('p'), e = document.getElementById('e');
  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!p.value) return;
    e.textContent = '…';
    try {
      var k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p.value), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(D.s), iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var url = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(D.i) }, key, b(D.c)));
      location.replace(url);
    } catch (x) {
      e.textContent = 'Password errata';
      p.value = ''; p.style.borderColor = '#d33';
    }
  });
  p.addEventListener('input', function () { p.style.borderColor = '#d2d2d2'; e.textContent = ''; });
})();
</script>
</body>
</html>
